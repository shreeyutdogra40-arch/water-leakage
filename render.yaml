services:
  # AquaFlow Full-Stack C# .NET 8 Web Application + IoT Telemetry & React UI
  - type: web
    name: aquaflow-smart-water
    runtime: docker
    dockerfilePath: Dockerfile.backend_csharp
    plan: free
    healthCheckPath: /api/status
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
