version: '3.8'

services:
  csharp-backend:
    build:
      context: .
      dockerfile: Dockerfile.backend_csharp
    ports:
      - "8000:8000"
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://0.0.0.0:8000
    volumes:
      - csharp-data:/app/data

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:80"
    depends_on:
      - csharp-backend

volumes:
  csharp-data:
